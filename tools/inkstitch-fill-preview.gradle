// Explicit candidate integration only. Does not alter the normal engine source set.
// Usage: ./gradlew -I tools/inkstitch-fill-preview.gradle \
//   -PfillPlannerSourceRoot=/path/to/worker/engine/src/main/kotlin :engine:test :engine:exportFillQualityFixtures
// Also set -PfillTatamiSourceRoot=/path/to/letter/engine/src/main/kotlin until its backend is on main.
// External sources are read-only compile inputs; they are never copied or committed here.
gradle.projectsEvaluated {
    def engine = gradle.rootProject.project(':engine')
    def packagePath = 'io/github/linker2k/myembro/engine/inkstitch/'
    def shared = ['stitch_plan/LockStitches.kt', 'stitch_plan/StitchPlanBuilder.kt', 'stitch_plan/SewingOptions.kt', 'stitch_plan/GeneratedPatternProcessor.kt', 'svg/PathEndPoints.kt']
    def missing = shared.findAll { !engine.file('src/main/kotlin/' + packagePath + it).isFile() }
    def external = engine.providers.gradleProperty('fillPlannerSourceRoot').orNull
    if (!missing.isEmpty() && external == null) {
        throw new GradleException('Fill preview awaits the shared planner commit; set -PfillPlannerSourceRoot explicitly to preview its Kotlin source directory.')
    }
    def sourceFiles = missing.collect { new File(external, packagePath + it) }
    sourceFiles.each { if (!it.isFile()) throw new GradleException('Missing shared planner preview source: ' + it) }
    // Reuse letter's committed backend until it reaches main; never vendor a second generator.
    def tatamiRoot = engine.providers.gradleProperty('fillTatamiSourceRoot').orNull
    ['stitches/InkAutoFill.kt', 'stitches/InkRunning.kt'].each { relative ->
        if (!engine.file('src/main/kotlin/' + packagePath + relative).isFile()) {
            if (tatamiRoot == null) throw new GradleException('Default tatami preview awaits letter backend; set -PfillTatamiSourceRoot to its Kotlin source root.')
            def input = new File(tatamiRoot, packagePath + relative)
            if (!input.isFile()) throw new GradleException('Missing letter tatami preview source: ' + input)
            sourceFiles.add(input)
        }
    }
    engine.tasks.named('compileKotlin').configure {
        source(engine.file('src/inkstitchPreview/kotlin'))
        sourceFiles.each { source(it) }
    }
    engine.tasks.named('compileTestKotlin').configure {
        source(engine.file('src/inkstitchPreviewTest/kotlin'))
    }
    engine.tasks.register('exportFillQualityFixtures', JavaExec) {
        dependsOn(engine.tasks.named('testClasses'))
        classpath = engine.sourceSets.test.runtimeClasspath
        mainClass.set('io.github.linker2k.myembro.engine.inkstitch.elements.FillQualityFixtures')
        args(engine.providers.gradleProperty('fillAuditDir').getOrElse('/tmp/myembro-fill-quality'))
    }
    engine.tasks.register('exportFillOracleMatrix', JavaExec) {
        dependsOn(engine.tasks.named('testClasses'))
        classpath = engine.sourceSets.test.runtimeClasspath
        mainClass.set('io.github.linker2k.myembro.engine.inkstitch.elements.FillOracleMatrix')
        maxHeapSize = '3g'
        ['matrix', 'owner', 'oracle-input-dir', 'output-dir', 'results-json', 'commit', 'case-filter', 'dependency-manifest'].each { name ->
            def value = engine.providers.gradleProperty('fillMatrix.' + name).orNull
            if (value != null) args('--' + name, value)
        }
    }
}
