name = "myembro-relay"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# APP_KEY and MCP_TOKEN are secrets. Supply them outside this file.

# Bind a dedicated namespace ID before deployment; omission permits local development only.
[[kv_namespaces]]
binding = "OAUTH_KV"
# id = "<dedicated-OAuth-KV-namespace-ID>"
# OWNER_PIN is an additional Worker secret; never set it under [vars].
