name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: FAT12 image test tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools
      - name: Python repeat-policy tests
        run: python3 -m unittest discover -s tools/tests -p test_quality_gate_repeat.py
      - name: Checks and representative engine tests
        timeout-minutes: 5
        run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-results
          path: engine/build/test-results/test/
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: myembro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
