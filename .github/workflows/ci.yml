name: CI

on:
  # Every branch, so agent branches are green before the integrator merges them.
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode counts commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: FAT12 image test tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools
      - name: Sweep selection and range reducer tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*sweep.py' -v
      - name: Checks and representative engine tests
        timeout-minutes: 5
        run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-results
          path: engine/build/test-results/test/
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: myembro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
